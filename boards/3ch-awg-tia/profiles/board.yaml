# boards/3ch-awg-tia/3ch-awg-tia.yaml
# Скриптовая генерация расстановки для 3CH-AWG-TIA (kicadspoke.explore/author,
# см. docs/board_coding.md) — параллельно profiles/3ch-awg-tia.yaml, который
# сделан руками и остаётся эталоном для сравнения (не трогаем).
#
# templates_file указывает на шаблоны, извлечённые (extract) прямо для этой
# области — boards/3ch-awg-tia/templates/templates.yaml, не путать с
# profiles/templates/3ch-awg-tia.yaml (тот эталон трогать нельзя).
templates_file: templates/templates.yaml
schematic_dir: ../../test_boards/3CH-AWG-TIA

# registry_path/track_registry_path НЕ заданы явно — новый конфиг, переносить
# исторические значения неоткуда, пусть выводятся автоматически
# (registry_path_for_config) рядом с этим файлом: 3ch-awg-tia.registry.json /
# 3ch-awg-tia.tracks.registry.json.

include:
  - extracts.yaml  # Коллекция экстраторов
  - templates/fpga_in_pi_filter.yaml
  - templates/fpga_pi_filter_spoke.yaml
  - generated/dac_channels.yaml   # scripts/dac_channels.py
  - generated/dac_pi_filter.yaml  # scripts/dac_pi_filter.py

