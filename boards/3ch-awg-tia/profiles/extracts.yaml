extract_profiles:

# Power Subsistem Templates
  p5v_pi_filter:
    name: 5v_pi_filter
    output: boards/3ch-awg-tia/profiles/templates/power_pi_filters.yaml
    params:
      PWR_IN: '+5V_DIRTY'
      PWR_OUT: '+5V'
    net_template:
      # ЛИТЕРАЛ: ПАТТЕРН (см. --net-template в docs/commands_ru.md и
      # net_resolution.parametrize_net) — раньше здесь было наоборот
      # (паттерн: литерал), из-за чего параметризация цепей молча не
      # срабатывала (parametrize_net тихо возвращает литерал как есть,
      # если его нет среди ключей — без ошибки, без предупреждения).
      '+5V_DIRTY': '{PWR_IN}'
      '+5V': '{PWR_OUT}'
    # FB1 (роль PI_FILTER_FB) сидит между двумя рельсами сразу — на его
    # падах ОБЕ цепи из net_template выше, extract сам не выберет.
    # Явно говорим: net_template этой роли — {PWR_IN}. Без этой строки
    # extract каждый раз молча оставляет net_template у PI_FILTER_FB
    # пустым (см. warning при извлечении).
    net_template_role:
      PI_FILTER_FB: '+5V_DIRTY'
    origin_by_component_role: C_IN_BULK
    origin_by_component_pad: '1'

  # ldo_out_pi_filter вынесен в profiles/subsystems/ldo.yaml (include:) —
  # живая проверка kicadspoke/config/includes.py.

  p5v_led_spoke:
    # cluster: Led_P5V
    name: led_spoke
    output: boards/3ch-awg-tia/profiles/templates/led_spoke.yaml
    params:
      PWR_IN: '+5V'
      PWR_OUT: '/Power/+5V_LED'
    net_template_role:
      'R_LED': '+5V'
      'LED': '/Power/+5V_LED'
    origin_by_component_role: R_LED
    origin_by_component_pad: '2'

  p2v5_ldo_adj:
    name: ldo_adj
    output: boards/3ch-awg-tia/profiles/templates/ldo_adj.yaml
    params:
      PWR_IN: '+5V'
      PWR_OUT: '+2V5_DIRTY'
      PWR_ADJ: '/Power/+2V5_ADJ'
    net_template_role:
      'C_IN_BYPASS': '+5V'
      'C_ADJ_BULK': '/Power/+2V5_ADJ'
      'D_PROT_ADJ': '/Power/+2V5_ADJ'
      'D_PROT_BACK': '+2V5_DIRTY'
      'R_FB_BOT': '/Power/+2V5_ADJ'
      'R_FB_TOP': '/Power/+2V5_ADJ'
      # Сама LDO (U3) висит на всех трёх цепях сразу (IN/OUT/ADJ) — без
      # этой строки net_template у роли пуст, apply падает fatal'ом
      # ("no net for mapping"). PWR_OUT — цепь, которую эта LDO
      # непосредственно регулирует, самый однозначный выбор.
      'LDO_ADJ': '+2V5_DIRTY'
    origin_by_component_role: 'C_IN_BYPASS'
    origin_by_component_pad: '2'

  p2v5_adj_pi_filter:
    name: ldo_adj_pi_filter
    output: boards/3ch-awg-tia/profiles/templates/ldo_adj_pi_filter.yaml
    params:
      PWR_IN: '+2V5_DIRTY'
      PWR_OUT: '+2V5'
    net_template:
      '+2V5_DIRTY': '{PWR_IN}'
      '+2V5': '{PWR_OUT}'
    net_template_role:
      C_IN_BYPASS: '+2V5_DIRTY'
      PI_FILTER_FB: '+2V5'
      C_OUT_BULK: '+2V5'
    origin_by_component_role: 'C_IN_BYPASS'
    origin_by_component_pad: '1'

  1v2_ldo_out_pi_filter:
    name: ldo_out_pi_filter
    output: boards/3ch-awg-tia/profiles/templates/ldo_out_pi_filter.yaml
    params:
      PWR_IN: '+1V2_DIRTY'
      PWR_OUT: '+1V2'
    net_template:
      '+5V_DIRTY': '{PWR_IN}'
      '+5V': '{PWR_OUT}'
    net_template_role:
      PI_FILTER_FB: '+1V2_DIRTY'
    origin_by_component_role: C_IN_BULK
    origin_by_component_pad: '1'

# FPGA Subsistem
  fpga_pwr_spoke:
    name: fpga_cap_pair   # ИМЯ ШАБЛОНА отличается от имени профиля — оставляем явно
    output: boards/3ch-awg-tia/profiles/templates/fpga_pi_filter_spoke.yaml
    # Выделить в PCB: 2 конденсатора спицы (Role=C_OUT_BYPASS/C_OUT_BULK)
    # + их GND-via + via уровня спицы (сеть "+3V3_VCCIO") + разведённые
    # дорожки между ними. FPGA (IC1) в выделение НЕ включать — попадёт
    # в шаблон как компонент роли FPGA и исчерпает пул на первой же спице.
    # via-net дал неоднозначность (2 via на +3V3_VCCIO в выделении —
    # проверь, не зацепило ли рамкой соседнюю спицу). Роль компонента
    # внутри выделения уникальна по построению (extract сам фатально
    # падает на дублирующихся ролях) — надёжнее.
    origin_by_component_role: C_OUT_BYPASS

  fpga_1v2_vccint_pi_filter:
    name: fpga_in_pi_filter   # ИМЯ ШАБЛОНА отличается от имени профиля — оставляем явно
    output: boards/3ch-awg-tia/profiles/templates/fpga_in_pi_filter.yaml
    params:
      PWR_IN: '+1V2'
      PWR_OUT: '+1V2_VCCINT'
    net_template_role:
      C_IN_BYPASS: '+1V2'
      C_OUT_BYPASS: '+1V2_VCCINT'
      C_OUT_BULK: '+1V2_VCCINT'
      C_IN_BULK: '+1V2'
      FB_PI_FLT: '+1V2_VCCINT'
    origin_by_component_role: 'C_OUT_BYPASS'
    origin_by_component_pad: '1'

# DAC Subsystems
  ch0_clk_vdd_dac_pi_filter:
    name: dac_clk_vdd_pi_filter
    output: boards/3ch-awg-tia/profiles/templates/dac_pi_filters.yaml
    origin_by_via_net: '/Channel_0/DAC/+3V3_CLKVDD'   # см. ниже про дефис
    params:
      PWR_IN: '+3V3'
      PWR_OUT: '/Channel_0/DAC/+3V3_CLKVDD'
    net_template:
      '+3V3': '{PWR_IN}'
      '/Channel_0/DAC/+3V3_CLKVDD': '{PWR_OUT}'
    net_template_role:
      FB_PI_FLT: '/Channel_0/DAC/+3V3_CLKVDD'   # выходная сеть — она per-channel уникальна

  dac_avdd_pi_filter:
    name: dac_avdd_pi_filter
    output: templates/dac_pi_filters.yaml
    origin_by_via_net: '/Channel_0/DAC/+3V3_AVDD'
    params:
      'PWR_IN': '+3V3'
      'PWR_OUT': '/Channel_0/DAC/+3V3_AVDD' 
    net_template_role:
      '+3V3_AVDD': '{PWR_OUT}' 
      '+3V3': '{PWR_IN}'