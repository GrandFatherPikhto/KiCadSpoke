    skip: false
    cell: 5v_pi_filter
    anchor_role: CONN_PM5V
    anchor_pad: '1'
    origin_x_mm:   7.0
    origin_y_mm: -12.0
    anchor_cluster: In_Pi_Filter_Pos
    params:
      PWR_IN: '+5V_DIRTY'
      PWR_OUT: '+5V'

  - name: p5v_led_spoke
    retired: false
