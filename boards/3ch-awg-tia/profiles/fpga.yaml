registry_path: registries/fpga.json
track_registry_path: registries/fpga.tracks.registry.json
log_file: ../logs/fpga.log
schematic_dir: ../../../test_boards/3CH-AWG-TIA
# Spoke layer for the ManualSpoke path (rules: in rules/fpga_spokes.yaml) —
# MUST be set here at the root, not inside the included file: include:
# only merges rules:/clone_placements:/templates:/extract_profiles:/
# clone_profiles: from an included file, any other top-level key (like
# layer:) is silently dropped. ManualSpoke ignores the template's own
# layer: field entirely (only ClonePlacement honours it) — ends up on
# F.Cu (the Config.layer default) without this.
layer: B.Cu

# Same reason as layer: above — thermal_via_array: inside the included
# fpga_thermal_vias.yaml is silently dropped by include: (not a list/dict
# section), so it must live here at the root instead.
thermal_via_array:
  name: fpga_thermal
  enabled: true
  active: true
  anchor_role: FPGA
  pad: '145'
  net: GND
  rows: 4
  cols: 4
  margin_mm: 0.5
  pattern: grid
  drill_mm: 0.3
  diameter_mm: 0.5

template_files:
  - templates/fpga_pi_filters.yaml
  - templates/fpga_cap_pair_spoke.yaml
  - templates/fpga_r_pi_filters.yaml
  - templates/fpga_oscill.yaml
  - templates/fpga_flash.yaml

include:
  - fpga_extracts.yaml  # Коллекция экстраторов
  - rules/fpga_spokes.yaml

clone_placements:

  - name: fpga
    enabled: true
    active: true
    role: FPGA
    nets:
      FPGA: GND
    anchor_role: CONN_PM5V
    origin_x_mm: 74.0
    origin_y_mm: 36.0


  - name: p3v3_vccio_pi_filter
    enabled: true
    active: true
    template: fpga_in_pi_filter
    anchor_cluster: Pi_Filter_3V3_VCCIO
    anchor_role: FPGA
    anchor_pad: '139'
    origin_x_mm: -4.0
    origin_y_mm: -6.0
    params:
      PWR_IN: '+3V3'
      PWR_OUT: '+3V3_VCCIO'

  - name: pi_filter_vccint
    enabled: true
    active: true
    template: fpga_in_pi_filter
    anchor_cluster: Pi_Filter_1V2_VCCINT
    anchor_role: FPGA
    anchor_pad: '1'
    origin_x_mm: -6.0
    origin_y_mm: -2.0
    params:
      PWR_IN: '+1V2'
      PWR_OUT: '+1V2_VCCINT'

  - name: p2v5_vcca_pi_filter
    enabled: true
    active: true
    template: fpga_in_pi_filter
    anchor_cluster: Pi_Filter_1V2_VCCA_P2V5
    anchor_role: FPGA
    anchor_pad: '34'
    origin_x_mm: -10.0
    origin_y_mm:  2.0
    params:
      PWR_IN: '+2V5'
      PWR_OUT: '+2V5_VCCA'

  - name: p1v2_vcd_pll_fpga_in_pi_filter
    enabled: true
    active: true
    template: fpga_in_pi_filter
    anchor_cluster: Pi_Filter_1V2_VCCD_PLL
    anchor_role: FPGA
    anchor_pad: '37'
    origin_x_mm: -6.0
    origin_y_mm:  5.0
    params:
      PWR_IN: '+1V2'
      PWR_OUT: '+1V2_VCCD_PLL'

# Oscillator system
  - name: fpga_oscill
    enabled: true
    active: true
    template: fpga_oscill
    anchor_role: FPGA
    anchor_cluster: FPGA
    anchor_pad: '22'
    origin_x_mm: -2.0
    origin_y_mm:  0.5
    nets:
      FPGA_OSCILL: '+3V3_OSCILL'
    params:
      'PWR_IN': '+3V3_OSCILL'
      'CLK_OUT': '/FPGA/CL_CLK_0'
    
  - name: fpga_oscill_r_pi_filter
    enabled: true
    active: true
    template: fpga_r_pi_filter
    anchor_cluster: Pi_Filter_3V3_Osc
    anchor_role: R_OSC_ON_PU
    anchor_pad: '2'
    origin_x_mm: -2.5
    origin_y_mm:  0.0
    nets:
      C_IN_BYPASS: '+3V3'
      C_IN_BULK: '+3V3'
      R_PI_FLT: '+3V3_OSCILL'
      C_OUT_BULK: '+3V3_OSCILL'
      C_OUT_BYPASS: '+3V3_OSCILL'
    params:
      'PWR_IN': '+3V3'
      'PWR_OUT': '+3V3_OSCILL'

  - name: fpga_flash
    enabled: true
    active: true
    template: fpga_flash
    anchor_cluster: FPGA_FLASH
    anchor_role: FPGA
    origin_x_mm: -30.0
    origin_y_mm: -15.0

  - name: fpga_flash_r_pi_filter
    enabled: true
    active: true
    template: fpga_r_pi_filter
    anchor_cluster: Pi_Filter_3V3_Flash
    anchor_role: FPGA_FLASH
    anchor_pad: '8'
    origin_x_mm: -2.5
    origin_y_mm:  0.0
    nets:
      C_IN_BYPASS: '+3V3'
      C_IN_BULK: '+3V3'
      R_PI_FLT: '+3V3_FLASH'
      C_OUT_BULK: '+3V3_FLASH'
      C_OUT_BYPASS: '+3V3_FLASH'
    params:
      'PWR_IN': '+3V3'
      'PWR_OUT': '+3V3_FLASH'
