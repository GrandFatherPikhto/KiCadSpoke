clone_placements:
# 3V3 LDO System
  - name: 3v3_ldo
    enabled: true
    active: true
    template: p3v3_ldo
    nets:
      LDO_1V2: '+3V3_DIRTY'
    params:
      PWR_IN: '+5V'
      PWR_OUT: '+3V3_DIRTY'
    anchor_role: C_OUT_BYPASS
    anchor_cluster: In_Pi_Filter_Pos
    # anchor_role: CONN_PM5V
    anchor_pad: '1'
    origin_x_mm: -50.0
    origin_y_mm:  35.0


  - name: 3v3_led_spoke
    enabled: true
    active: true
    template: led_spoke
    anchor_cluster: Pi_Filter_Out_3V3
    anchor_role: C_OUT_BYPASS
    anchor_pad: '1'
    origin_x_mm: -2.0
    origin_y_mm:  5.0
    params:
      PWR_IN: '+3V3'
      PWR_OUT: '/Power/+3V3_LED'

  - name: 3v3_ldo_out_pi_filter
    enabled: true
    active: true
    template: ldo_out_pi_filter
    anchor_role: LDO_3V3
    anchor_pad: '2'
    anchor_cluster: Pi_Filter_Out_3V3
    origin_x_mm: 12.0
    origin_y_mm: 0.0
    params:
      PWR_IN: '+3V3_DIRTY'
      PWR_OUT: '+3V3'
