templates_file: templates/3ch-awg-tia.yaml
schematic_dir: ../test_boards/3CH-AWG-TIA
registry_path: profiles/registries/3ch-awg-tia.json
track_registry_path: profiles/registries/power_board.tracks.registry.json
log_file: ../logs/3ch-awg-tia.log

# Слой ManualSpoke-пути (rules ниже) — глобальный, из
# profiles/generated/10CL006YE144C8G.yaml, откуда сюда же перенесены
# thermal_via_array и rules, чтобы `apply profiles/3ch-awg-tia.yaml`
# одной командой ставил и спицы FPGA, и остальное (clone_placements).
layer: B.Cu

thermal_via_array:
  enabled: true
  anchor_role: FPGA
  pad: '145'
  net: GND
  rows: 4
  cols: 4
  margin_mm: 0.5
  pattern: grid
  drill_mm: 0.3
  diameter_mm: 0.5

rules:
- net: +3V3_VCCIO
  anchor_role: FPGA
  spokes:
  - pad: '17'
    template: cap_pair_standard
    shift_x_mm: 0.0
    shift_y_mm: -0.5
    rotation_deg: 90.0
    cluster: FPGA_PWR_BANK
  - pad: '26'
    template: cap_pair_standard
    shift_x_mm: 0.0
    shift_y_mm: -2.4
    rotation_deg: 90.0
    cluster: FPGA_PWR_BANK
  - pad: '40'
    template: cap_pair_standard
    shift_x_mm: 1.3
    shift_y_mm: 0.0
    rotation_deg: 180.0
    cluster: FPGA_PWR_BANK
  - pad: '47'
    template: cap_pair_standard
    shift_x_mm: 2.5
    shift_y_mm: 0.0
    rotation_deg: 180.0
    cluster: FPGA_PWR_BANK
  - pad: '56'
    template: cap_pair_standard
    shift_x_mm: 0.3
    shift_y_mm: 0.0
    rotation_deg: 180.0
    cluster: FPGA_PWR_BANK
  - pad: '62'
    template: cap_pair_standard
    shift_x_mm: 2.0
    shift_y_mm: 0.0
    rotation_deg: 180.0
    cluster: FPGA_PWR_BANK
  - pad: '81'
    template: cap_pair_standard
    shift_x_mm: 0.0
    shift_y_mm: -1.0
    rotation_deg: 270.0
    cluster: FPGA_PWR_BANK
  - pad: '93'
    template: cap_pair_standard
    shift_x_mm: 0.0
    shift_y_mm: 0.0
    rotation_deg: 270.0
    cluster: FPGA_PWR_BANK
  - pad: '117'
    template: cap_pair_standard
    shift_x_mm: -2.0
    shift_y_mm: 0.0
    rotation_deg: 0.0
    cluster: FPGA_PWR_BANK
  - pad: '122'
    template: cap_pair_standard
    shift_x_mm: -1.8
    shift_y_mm: 0.0
    rotation_deg: 0.0
    cluster: FPGA_PWR_BANK
  - pad: '130'
    template: cap_pair_standard
    shift_x_mm: 0.0
    shift_y_mm: 0.0
    rotation_deg: 0.0
    cluster: FPGA_PWR_BANK
  - pad: '139'
    template: cap_pair_standard
    shift_x_mm: 0.0
    shift_y_mm: 0.0
    rotation_deg: 0.0
    cluster: FPGA_PWR_BANK
- net: +1V2_VCCINT
  anchor_role: FPGA
  spokes:
  - pad: '5'
    template: cap_pair_standard
    shift_x_mm: 0.0
    shift_y_mm: 0.0
    rotation_deg: 90.0
    cluster: FPGA_PWR_BANK
  - pad: '29'
    template: cap_pair_standard
    shift_x_mm: 0.0
    shift_y_mm: -1.5
    rotation_deg: 90.0
    cluster: FPGA_PWR_BANK
  - pad: '45'
    template: cap_pair_standard
    shift_x_mm: 1.0
    shift_y_mm: 0.0
    rotation_deg: 180.0
    cluster: FPGA_PWR_BANK
  - pad: '61'
    template: cap_pair_standard
    shift_x_mm: -0.0
    shift_y_mm: 0.0
    rotation_deg: 180.0
    cluster: FPGA_PWR_BANK
  - pad: '78'
    template: cap_pair_standard
    shift_x_mm: 0.0
    shift_y_mm: 0.0
    rotation_deg: 270.0
    cluster: FPGA_PWR_BANK
  - pad: '102'
    template: cap_pair_standard
    shift_x_mm: 0.0
    shift_y_mm: 1.0
    rotation_deg: 270.0
    cluster: FPGA_PWR_BANK
  - pad: '116'
    template: cap_pair_standard
    shift_x_mm: -0.3
    shift_y_mm: 0.0
    rotation_deg: 0.0
    cluster: FPGA_PWR_BANK
  - pad: '134'
    template: cap_pair_standard
    shift_x_mm: -0.3
    shift_y_mm: 0.0
    rotation_deg: 0.0
    cluster: FPGA_PWR_BANK
- net: +1V2_VCCD_PLL
  anchor_role: FPGA
  spokes:
  - pad: '37'
    template: cap_pair_standard
    shift_x_mm: 0.5
    shift_y_mm: 0.0
    rotation_deg: 180.0
    cluster: FPGA_PWR_BANK
  - pad: '109'
    template: cap_pair_standard
    shift_x_mm: -1.5
    shift_y_mm: 0.0
    rotation_deg: 0.0
    cluster: FPGA_PWR_BANK
- net: +2V5_VCCA
  anchor_role: FPGA
  spokes:
  - pad: '35'
    template: cap_pair_standard
    shift_x_mm: 0.0
    shift_y_mm: -2.0
    rotation_deg: 90.0
    cluster: FPGA_PWR_BANK
  - pad: '107'
    template: cap_pair_standard
    shift_x_mm: 0.0
    shift_y_mm: 1.0
    rotation_deg: 270.0
    cluster: FPGA_PWR_BANK

extract_profiles:
  fpga_pwr_bank:
    # Выделить в PCB: 2 конденсатора спицы (Role=C_OUT_BYPASS/C_OUT_BULK)
    # + их GND-via + via уровня спицы (сеть "+3V3_VCCIO") + разведённые
    # дорожки между ними. FPGA (IC1) в выделение НЕ включать — попадёт
    # в шаблон как компонент роли FPGA и исчерпает пул на первой же спице.
    name: cap_pair_standard   # тем же именем, что и в rules: templates: cap_pair_standard
    output: profiles/templates/3ch-awg-tia.yaml
    # via-net дал неоднозначность (2 via на +3V3_VCCIO в выделении —
    # проверь, не зацепило ли рамкой соседнюю спицу). Роль компонента
    # внутри выделения уникальна по построению (extract сам фатально
    # падает на дублирующихся ролях) — надёжнее.
    origin_by_component_role: C_OUT_BYPASS
    param:

  5v_pi_filter:
    name: 5v_pi_filter
    output: profiles/templates/3ch-awg-tia.yaml
    param:
      PWR_IN: '+5V_DIRTY'
      PWR_OUT: '+5V'
    net_template:
      # ЛИТЕРАЛ: ПАТТЕРН (см. --net-template в docs/commands_ru.md и
      # net_resolution.parametrize_net) — раньше здесь было наоборот
      # (паттерн: литерал), из-за чего параметризация цепей молча не
      # срабатывала (parametrize_net тихо возвращает литерал как есть,
      # если его нет среди ключей — без ошибки, без предупреждения).
      '+5V_DIRTY': '{PWR_IN}'
      '+5V': '{PWR_OUT}'
    # FB1 (роль PI_FILTER_FB) сидит между двумя рельсами сразу — на его
    # падах ОБЕ цепи из net_template выше, extract сам не выберет.
    # Явно говорим: net_template этой роли — {PWR_IN}. Без этой строки
    # extract каждый раз молча оставляет net_template у PI_FILTER_FB
    # пустым (см. warning при извлечении).
    net_template_role:
      PI_FILTER_FB: '+5V_DIRTY'
    origin_by_component_role: C_IN_BULK
    origin_by_component_pad: '1'

clone_placements:
  # - name: conn_pm5v
  #   role: CONN_PM5V
  #   origin_x_mm: 0.0
  #   origin_y_mm: 0.0
  #   rotation_deg: 9.0
  - name: p5v_pi_filter
    template: 5v_pi_filter
    # C_IN_BULK как anchor_role неоднозначен на плате (второй такой же
    # в Cluster=In_Pi_Filter_Neg) — anchor_cluster сужает до нужного.
    # anchor_pad: '1' — тот же пад, что был origin_by_component_pad при
    # extract, чтобы якорь совпал с нулём координат самого шаблона.
    anchor_role: CONN_PM5V
    anchor_pad: '1'
    origin_x_mm: 10.0
    origin_y_mm: -3.0    
    # anchor_role: C_IN_BULK
    # anchor_cluster: In_Pi_Filter_Pos
    # anchor_pad: '1'
    # params (не param!) — ключ ClonePlacement, отличается от param: в
    # extract_profiles (это разные структуры). Наличие params включает
    # режим "по цепям" — все роли шаблона резолвятся по net_template,
    # не по выделению на плате.
    params:
      PWR_IN: '+5V_DIRTY'
      PWR_OUT: '+5V'
