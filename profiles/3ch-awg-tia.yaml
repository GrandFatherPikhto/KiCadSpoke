templates_file: templates/3ch-awg-tia.yaml
schematic_dir: D:/Projects/Python/KiCadSpoke/test_boards/3CH-AWG-TIA
registry_path: profiles/registries/3ch-awg-tia.json
track_registry_path: profiles/registries/power_board.tracks.registry.json

extract_profiles:
  fpga_pwr_bank:
    name: fpga_pwr_bank
    output: profiles/templates/3ch-awg-tia.yaml
    param:

  5v_pi_filter:
    name: 5v_pi_filter
    output: profiles/templates/3ch-awg-tia.yaml
    param:
      PWR_IN: '+5V_DIRTY'
      PWR_OUT: '+5V'
      channel: 1   # <-- добавить параметр для канала
    net_template:
      '{PWR_IN}': '+5V_DIRTY'
      '{PWR_OUT}': '+5V'
    origin_by_component_role: C_IN_BULK
    origin_by_component_pad: '1'

clone_placements:
  - name: conn_pm5v
    role: CONN_PM5V
    origin_x_mm: 0.0
    origin_y_mm: 0.0
    rotation_deg: 9.0
