templates_file: templates/3ch-awg-tia.yaml
schematic_dir: ../test_boards/3CH-AWG-TIA
include:
  - subsystems/thermal_vias.yaml
  - subsystems/fpga_spokes.yaml
  - subsystems/led_spokes.yaml
  - subsystems/ldo.yaml
  - subsystems/filters.yaml
  - subsystems/extracts.yaml

registry_path: profiles/registries/3ch-awg-tia.json
track_registry_path: profiles/registries/power_board.tracks.registry.json
log_file: ../logs/3ch-awg-tia.log

# output: общий для всех extract_profiles ниже (все пишут в один и тот же файл
# шаблонов этой платы) — задан один раз здесь, чтобы не повторять в каждом
# профиле. Нужен другой файл для конкретного профиля — просто пропишите
# output: прямо в нём, это переопределит значение отсюда (см. load_profile
# в kicadspoke_cli.py, root_defaults).
output: profiles/templates/3ch-awg-tia.yaml

clone_placements:
  
  - name: channel_0_ad9707
    enabled: true
    anchor_sheet: Channel_0
    anchor_role: FPGA
    role: AD_DAC
    # Без nets/params role AD_DAC уходит в режим "по выделению" (см.
    # clone_uses_selection_mode) — а он неоднозначен на плате (IC2/IC3/IC4,
    # одна и та же Role с трёх инстансов channel.kicad_sch). anchor_sheet
    # сужает только сам якорь (FPGA — он один, сужать и не нужно), но НЕ
    # сужает роль ВНУТРИ шаблона — для этого явный net с {channel}.
    nets:
      AD_DAC: '/Channel_{channel}/DAC/DAC_OUT_P'
    params:
      channel: 0
    origin_x_mm: 0.0
    origin_y_mm: 25.0
    rotation_deg: 270.0

  - name: channel_1_ad9707
    enabled: true
    anchor_sheet: Channel_1
    anchor_role: FPGA
    role: AD_DAC
    nets:
      AD_DAC: '/Channel_{channel}/DAC/DAC_OUT_P'
    params:
      channel: 1
    origin_x_mm: 25.0
    origin_y_mm: 0.0
    rotation_deg: 0.0

  - name: channel_2_ad9707
    enabled: true
    anchor_sheet: Channel_2
    anchor_role: FPGA
    role: AD_DAC
    nets:
      AD_DAC: '/Channel_{channel}/DAC/DAC_OUT_P'
    params:
      channel: 2
    origin_x_mm:  0.0
    origin_y_mm: -25.0
    rotation_deg: 90.0

  - name: channel_0_r_term_p
    enabled: true
    # anchor_sheet теперь тоже параметризуется через {params} (см.
    # resolve_anchor_by_role/resolve_placeholder) — узнаёт нужный IC2/IC3/IC4
    # по имени листа-инстанса, не только по nets.
    anchor_sheet: 'Channel_{channel}'
    role: R_TERM_P
    anchor_role: AD_DAC
    anchor_pad: '21'
    origin_x_mm: 0.4
    origin_y_mm: 3.0
    rotation_deg: 270.0
    nets:
      R_TERM_P: '/Channel_{channel}/DAC/DAC_OUT_P'
    params:
      channel: 0

  - name: channel_0_r_term_n
    enabled: true
    anchor_sheet: 'Channel_{channel}'
    role: R_TERM_N
    anchor_role: AD_DAC
    anchor_pad: '20'
    origin_x_mm: -0.4
    origin_y_mm: 3.0
    rotation_deg: 270.0
    nets:
      R_TERM_N: '/Channel_{channel}/DAC/DAC_OUT_N'
    params:
      channel: 0

  - name: channel_0_с_refio
    enabled: true
    anchor_sheet: 'Channel_{channel}'
    role: C_DAC_REFIO
    anchor_role: AD_DAC
    anchor_pad: '23'
    origin_x_mm: 0.7
    origin_y_mm: 3.0
    rotation_deg: 270.0
    nets:
      C_DAC_REFIO: '/Channel_{channel}/DAC/DAC_REFIO'
    params:
      channel: 0

  - name: channel_0_r_dac_fs_adj
    enabled: true
    anchor_sheet: 'Channel_{channel}'
    role: R_DAC_FS_ADJ
    anchor_role: AD_DAC
    anchor_pad: '24'
    origin_x_mm: 1.5
    origin_y_mm: 3.0
    rotation_deg: 270.0
    nets:
      R_DAC_FS_ADJ: '/Channel_{channel}/DAC/DAC_FS_ADJ'
    params:
      channel: 0

  - name: channel_0_op_amp
    enabled: true
    anchor_sheet: 'Channel_{channel}'
    role: OP_AMP
    # anchor_role: R_TERM_P — неоднозначен (эта Role дважды на канале: между
    # DAC и входом ОУ, и между выходом ОУ и входом усилителя мощности,
    # Cluster у обоих пуст, anchor_sheet сужает только до листа). OP_AMP сам
    # по себе уникален на канал — якоримся на уже рабочую связку AD_DAC.
    anchor_role: AD_DAC
    # anchor_pad: '2'
    origin_x_mm: 0.0
    origin_y_mm: 10.0
    rotation_deg: 180
    nets:
      OP_AMP: '/Channel_{channel}/OpAmp/OA_IN_P'
    params:
      channel: 0

