extract_profiles:
  # name: не нужен, если совпадает с ключом профиля (берётся автоматически,
  # см. root_defaults/name в kicadspoke_cli.py:cmd_extract) — писать явно,
  # только когда имя шаблона должно ОТличаться от имени профиля, как ниже
  # у fpga_pwr_bank. params (не param — единый ключ с clone_placements,
  # раньше был param: именно тут, отдельная опечатка-ловушка) используется
  # только для верификации round-trip у --net-template, в шаблон не пишется.
  fpga_pwr_bank:
    # Выделить в PCB: 2 конденсатора спицы (Role=C_OUT_BYPASS/C_OUT_BULK)
    # + их GND-via + via уровня спицы (сеть "+3V3_VCCIO") + разведённые
    # дорожки между ними. FPGA (IC1) в выделение НЕ включать — попадёт
    # в шаблон как компонент роли FPGA и исчерпает пул на первой же спице.
    name: cap_pair_standard   # ИМЯ ШАБЛОНА отличается от имени профиля — оставляем явно
    # via-net дал неоднозначность (2 via на +3V3_VCCIO в выделении —
    # проверь, не зацепило ли рамкой соседнюю спицу). Роль компонента
    # внутри выделения уникальна по построению (extract сам фатально
    # падает на дублирующихся ролях) — надёжнее.
    origin_by_component_role: C_OUT_BYPASS

  5v_pi_filter:
    params:
      PWR_IN: '+5V_DIRTY'
      PWR_OUT: '+5V'
    net_template:
      # ЛИТЕРАЛ: ПАТТЕРН (см. --net-template в docs/commands_ru.md и
      # net_resolution.parametrize_net) — раньше здесь было наоборот
      # (паттерн: литерал), из-за чего параметризация цепей молча не
      # срабатывала (parametrize_net тихо возвращает литерал как есть,
      # если его нет среди ключей — без ошибки, без предупреждения).
      '+5V_DIRTY': '{PWR_IN}'
      '+5V': '{PWR_OUT}'
    # FB1 (роль PI_FILTER_FB) сидит между двумя рельсами сразу — на его
    # падах ОБЕ цепи из net_template выше, extract сам не выберет.
    # Явно говорим: net_template этой роли — {PWR_IN}. Без этой строки
    # extract каждый раз молча оставляет net_template у PI_FILTER_FB
    # пустым (см. warning при извлечении).
    net_template_role:
      PI_FILTER_FB: '+5V_DIRTY'
    origin_by_component_role: C_IN_BULK
    origin_by_component_pad: '1'

  # ldo_out_pi_filter вынесен в profiles/subsystems/ldo.yaml (include:) —
  # живая проверка kicadspoke/config/includes.py.

  led_spoke:
    # cluster: Led_P5V
    params:
      PWR_IN: '+5V'
      PWR_OUT: '/Power/+5V_LED'
    net_template_role:
      'R_LED': '+5V'
      'LED': '/Power/+5V_LED'
    origin_by_component_role: R_LED
    origin_by_component_pad: '2'

  ldo_adj_subsystem:
    params:
      PWR_IN: '+5V'
      PWR_OUT: '+2V5_DIRTY'
      PWR_ADJ: '/Power/+2V5_ADJ'
    net_template_role:
      'C_IN_BYPASS': '+5V'
      'C_ADJ_BULK': '/Power/+2V5_ADJ'
      'D_PROT_ADJ': '/Power/+2V5_ADJ'
      'D_PROT_BACK': '+2V5_DIRTY'
      'R_FB_BOT': '/Power/+2V5_ADJ'
      'R_FB_TOP': '/Power/+2V5_ADJ'
      # Сама LDO (U3) висит на всех трёх цепях сразу (IN/OUT/ADJ) — без
      # этой строки net_template у роли пуст, apply падает fatal'ом
      # ("no net for mapping"). PWR_OUT — цепь, которую эта LDO
      # непосредственно регулирует, самый однозначный выбор.
      'LDO_ADJ': '+2V5_DIRTY'
    origin_by_component_role: 'C_IN_BYPASS'
    origin_by_component_pad: '2'

  2v5_adj_pi_filter:
    params:
      PWR_IN: '+2V5_DIRTY'
      PWR_OUT: '+2V5'
    net_template:
      '+2V5_DIRTY': '{PWR_IN}'
      '+2V5': '{PWR_OUT}'
    net_template_role:
      C_IN_BYPASS: '+2V5_DIRTY'
      PI_FILTER_FB: '+2V5'
      C_OUT_BULK: '+2V5'
    origin_by_component_role: 'C_IN_BYPASS'
    origin_by_component_pad: '1'

  fpga_in_pi_filter:
    params:
      PWR_IN: '+1V2'
      PWR_OUT: '+1V2_VCCINT'
    net_template_role:
      C_IN_BYPASS: '+1V2'
      C_OUT_BYPASS: '+1V2_VCCINT'
      C_OUT_BULK: '+1V2_VCCINT'
      C_IN_BULK: '+1V2'
      FB_PI_FLT: '+1V2_VCCINT'
    origin_by_component_role: 'C_OUT_BYPASS'
    origin_by_component_pad: '1'

  ldo_out_pi_filter:
    params:
      PWR_IN: '+1V2_DIRTY'
      PWR_OUT: '+1V2'
    net_template:
      '+5V_DIRTY': '{PWR_IN}'
      '+5V': '{PWR_OUT}'
    net_template_role:
      PI_FILTER_FB: '+1V2_DIRTY'
    origin_by_component_role: C_IN_BULK
    origin_by_component_pad: '1'

  ldo_adj_subsystem:
    params:
      PWR_IN: '+5V'
      PWR_OUT: '+2V5_DIRTY'
      PWR_ADJ: '/Power/+2V5_ADJ'
    net_template_role:
      'C_IN_BYPASS': '+5V'
      'C_ADJ_BULK': '/Power/+2V5_ADJ'
      'D_PROT_ADJ': '/Power/+2V5_ADJ'
      'D_PROT_BACK': '+2V5_DIRTY'
      'R_FB_BOT': '/Power/+2V5_ADJ'
      'R_FB_TOP': '/Power/+2V5_ADJ'
      # Сама LDO (U3) висит на всех трёх цепях сразу (IN/OUT/ADJ) — без
      # этой строки net_template у роли пуст, apply падает fatal'ом
      # ("no net for mapping"). PWR_OUT — цепь, которую эта LDO
      # непосредственно регулирует, самый однозначный выбор.
      'LDO_ADJ': '+2V5_DIRTY'
    origin_by_component_role: 'C_IN_BYPASS'
    origin_by_component_pad: '2'
