# profiles/subsystems/ldo.yaml
# 3.3V LDO subsystem — split out from profiles/3ch-awg-tia.yaml via include:
# (live verification of kicadspoke/config/includes.py) as a demo of grouping
# extract_profiles + clone_placements for one subsystem in one file, instead
# of splitting by section. 1v2_ldo_out_pi_filter stays in the root file for
# now (shares the ldo_out_pi_filter template/extract_profile with 3v3, but
# wasn't part of this split).

clone_placements:
  - name: 3v3_ldo
    enabled: false
    role: LDO_3V3
    # nets обязателен: без него и без params clone_uses_selection_mode()
    # уходит в режим "по выделению на плате мышкой", а не "по цепям" — и
    # тогда результат зависит от того, что случайно выделено в редакторе
    # в момент запуска apply (см. фатал "role X is not in the template").
    nets:
      LDO_3V3: '+3V3_DIRTY'
    anchor_role: C_OUT_BYPASS
    anchor_cluster: In_Pi_Filter_Pos
    anchor_pad: '1'
    origin_x_mm: -5.0
    origin_y_mm: 35.0

  - name: 3v3_ldo_out_pi_filter
    enabled: false
    template: ldo_out_pi_filter
    anchor_role: LDO_3V3
    anchor_pad: '2'
    anchor_cluster: Pi_Filter_Out_3V3
    origin_x_mm: 12.0
    origin_y_mm: 0.0
    params:
      PWR_IN: '+3V3_DIRTY'
      PWR_OUT: '+3V3'

# Power/LDO
  - name: p2v5_dirty_ldo
    enabled: false
    template: ldo_adj_subsystem
    # anchor_cluster: In_Pi_Filter_Pos
    # anchor_role: C_OUT_BYPASS
    anchor_role: CONN_PM5V
    anchor_pad: '1'
    origin_x_mm: 5.0
    origin_y_mm: 48.0
    params:
      PWR_IN: '+5V'
      PWR_OUT: '+2V5_DIRTY'
      PWR_ADJ: '/Power/+2V5_ADJ'

  - name: n2v5_dirty_ldo
    enabled: false
    template: ldo_adj_subsystem
    # anchor_cluster: In_Pi_Filter_Neg
    anchor_role: CONN_PM5V
    anchor_pad: '1'
    origin_x_mm: 5.0
    origin_y_mm: 68.0
    params:
      PWR_IN: '-5V'
      PWR_OUT: '-2V5_DIRTY'
      PWR_ADJ: '/Power/-2V5_ADJ'

  - name: 1v2_ldo
    enabled: false
    role: LDO_1V2
    nets:
      LDO_1V2: '+1V2_DIRTY'
    anchor_role: C_OUT_BYPASS
    anchor_cluster: In_Pi_Filter_Pos
    # anchor_role: CONN_PM5V
    anchor_pad: '1'
    origin_x_mm: -5.0
    origin_y_mm: 25.0
